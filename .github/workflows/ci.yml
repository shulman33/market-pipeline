name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: goldman-porfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Build matching-engine image (required by test_matching_engine.py)
        run: docker compose build matching-engine

      - name: Pytest
        run: pytest -v

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matching-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven test
        run: mvn -B test

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build
