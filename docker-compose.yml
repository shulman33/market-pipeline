services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d market"]
      interval: 2s
      timeout: 3s
      retries: 20

  ingestor:
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/market
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/market
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  postgres-data:
